name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          name: "VaultsRemake ${{ github.ref_name }}"
          body: |
            ## 🚀 VaultsRemake ${{ github.ref_name }} - Initial Release
            
            Welcome to the first official release of **VaultsRemake**! This plugin is designed to provide a high-performance, asynchronous player vault system for Minecraft servers.
            
            ### ✨ Features
            - **Asynchronous Storage**: Powered by MongoDB for zero lag during data saves.
            - **Customizable GUIs**: Clean and intuitive menus for managing player vaults.
            - **Admin Tools**: Extensive commands to view, delete, and revert vaults.
            - **Item Blacklisting**: Block specific items from being stored.
            - **Backup System**: Built-in snapshot system to prevent data loss.
            
            ### 📦 Installation
            1. Download the attached `VaultsRemake.jar`.
            2. Place it in your `plugins` folder.
            3. Configure your MongoDB credentials in `config.yml`.
            
            ---
            *Automatically generated by GitHub Actions*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
